# The @owwkmidream/dsh-mcp-sidebar bundle patch: mounts the plugin's server
# half as one Cordis loader row. The same entry is also the browser roster row
# (the plugin declares `dsh.client`), so the client half is discovered from it
# by the client-modules node half. Apply this bundle after `dsh-base` +
# `dsh-web-app`, which provide `loader` (base) and the web settings shell; the
# plugin's own `inject` resolves against those.

- insert:
    - id: mcp-sidebar
      name: '@owwkmidream/dsh-mcp-sidebar'
